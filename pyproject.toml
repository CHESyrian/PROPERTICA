[project]
name = "propertica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CHESyrian", email = "tarek940gh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "django>=6.0,<7",
    "django-filter>=24.0",
    "django-storages>=1.14",
    "djangorestframework>=3.15",
    "gunicorn>=22.0",
    "pillow>=10.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "whitenoise>=6.6",
]

[project.scripts]
propertica = "propertica:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
